<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYCHELIN GUIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@800&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #E3F2FD;
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh; overflow-x: hidden; position: relative;
        }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; box-sizing: border-box; }
        h1 { 
            margin: 0; 
            font-family: 'Raleway', sans-serif; 
            font-weight: 800;                  
            font-size: 1.8rem;                 
            color: #37474F; 
            letter-spacing: -0.5px;            
        }
        .write-btn {
            background-color: #3F51B5; color: white; border: none; padding: 10px 18px;
            border-radius: 20px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.2s;
        }
        .write-btn:hover { background-color: #303F9F; }
        
        #bubble-container { 
            position: relative; 
            width: 100%; 
            min-height: calc(100vh - 100px); 
            height: auto; 
            box-sizing: border-box;
            padding-bottom: 80px; 
        }
        .bubble-item {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            cursor: grab; transition: transform 0.2s; animation: float 4s ease-in-out infinite alternate;
            user-select: none; -webkit-user-drag: none; /* 드래그 시 텍스트 블록/이미지 깨짐 방지 */
        }
        .bubble-item:active { cursor: grabbing; }
        .bubble-item:hover { transform: scale(1.05); z-index: 10; }
        
        /* [중요] 드래그 중일 때 애니메이션을 멈추고 반응 속도를 올리는 클래스 */
        .bubble-item.dragging {
            animation: none !important;
            transition: none !important;
            z-index: 1000 !important;
        }

        .bubble {
            width: 85px; height: 85px; border-radius: 50%; background-size: cover; background-position: center;
            background-color: rgba(255, 255, 255, 0.5); border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); backdrop-filter: blur(2px); overflow: hidden;
            pointer-events: none; /* 버블 내부 요소가 마우스 이벤트를 방해하지 않도록 처리 */
        }
        .bubble.has-img { position: relative; }
        .bubble.has-img::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.25); }
        .bubble-info {
            margin-top: 6px; font-size: 0.75rem; color: #455A64; background: rgba(255, 255, 255, 0.6);
            padding: 2px 8px; border-radius: 10px; text-align: center; max-width: 90px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            pointer-events: none;
        }
        @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content { background-color: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-top: 0; font-size: 1.3rem; color: #37474F; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: #546E7A; margin-bottom: 4px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #CFD8DC; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        .form-group textarea { height: 100px; resize: none; }
        .btn-area { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-submit { background-color: #3F51B5; color: white; }
        .btn-close { background-color: #ECEFF1; color: #546E7A; }
        .btn-delete { background-color: #FF5252; color: white; margin-right: auto; }
        .btn-edit { background-color: #FFB300; color: white; } 
        .detail-img { width: 100%; max-height: 300px; object-fit: contain; background-color: #f0f0f0; border-radius: 8px; margin-bottom: 12px; cursor: zoom-in; }
        .detail-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
        .detail-author { font-size: 0.85rem; color: #78909C; margin-bottom: 12px; border-bottom: 1px solid #ECEFF1; padding-bottom: 8px; }
        .detail-content { font-size: 0.95rem; color: #37474F; white-space: pre-wrap; line-height: 1.5; }
        
        .zoom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center;
            cursor: zoom-out;
        }
        .zoom-img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 4px; }

        .view-toggle-area { display: flex; gap: 6px; margin-left: 12px; }
        .toggle-btn {
            background-color: rgba(255,255,255,0.6); color: #37474F; border: 1px solid #CFD8DC;
            padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s; line-height: 1;
        }
        .toggle-btn.active { background-color: #37474F; color: white; border-color: #37474F; }

        /* 리스트 뷰 전용 스타일 (리스트 모드일 때는 드래그를 막아야 하므로 스타일 분리) */
        .list-view-mode {
            display: flex; flex-direction: column; gap: 10px; padding: 10px 20px; box-sizing: border-box;
        }
        .list-view-mode .bubble-item {
            position: static !important; transform: none !important; animation: none !important;
            flex-direction: row; justify-content: flex-start; align-items: center; width: 100%;
            background: rgba(255, 255, 255, 0.8); padding: 12px 16px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); box-sizing: border-box; gap: 15px; cursor: pointer;
        }
        .list-view-mode .bubble-item:hover { background: rgba(255, 255, 255, 1); transform: translateY(-2px) !important; }
        .list-view-mode .bubble { width: 45px; height: 45px; border-radius: 8px; flex-shrink: 0; } 
        .list-view-mode .bubble-info { margin-top: 0; max-width: none; font-weight: bold; font-size: 0.9rem; background: none; padding: 0; text-align: left; }
        .list-title-text { font-size: 0.85rem; color: #78909C; margin-left: auto; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <h1 style="display: flex; align-items: center;">
            MYCHELIN GUIDE🍽️
            <div class="view-toggle-area">
                <button id="btnBubble" class="toggle-btn active" onclick="switchView('bubble')">버블</button>
                <button id="btnList" class="toggle-btn" onclick="switchView('list')">리스트</button>
            </div>
        </h1>
        <button class="write-btn" onclick="openModal('writeModal')">글쓰기</button>
    </header>

    <div id="bubble-container"></div>

    <div id="writeModal" class="modal">
        <div class="modal-content">
            <h2 id="modalHeaderTitle">맛집 등록하기</h2>
            <form id="postForm" onsubmit="savePost(event)">
                <input type="hidden" id="editPostId" value="">
                <div class="form-group">
                    <label>학번 이름</label>
                    <input type="text" id="author" placeholder="예: 10101 홍길동" required>
                </div>
                <div class="form-group">
                    <label>맛집 이름 (제목)</label>
                    <input type="text" id="title" placeholder="어디에 있는 어떤 맛집인가요?" required>
                </div>
                <div class="form-group">
                    <label>추천 이유 (내용)</label>
                    <textarea id="content" placeholder="맛있는 메뉴나 꿀팁을 적어주세요!" required></textarea>
                </div>
                <div class="form-group" id="imageInputGroup">
                    <label>맛집 사진</label>
                    <input type="file" id="image" accept="image/*">
                </div>
                <div class="btn-area">
                    <button type="button" class="btn btn-close" onclick="closeModal('writeModal')">취소</button>
                    <button type="submit" class="btn btn-submit" id="submitBtn">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <img id="detailImg" class="detail-img" src="" alt="맛집 사진">
            <div id="detailTitle" class="detail-title"></div>
            <div id="detailAuthor" class="detail-author"></div>
            <div id="detailContent" class="detail-content"></div>
            <div class="btn-area">
                <button type="button" id="deleteBtn" class="btn btn-delete">삭제</button>
                <button type="button" id="editBtn" class="btn btn-edit">수정</button> 
                <button type="button" class="btn btn-close" onclick="closeModal('detailModal')">닫기</button>
            </div> 
        </div>
    </div>

    <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
        <img id="zoomImg" class="zoom-img" src="" alt="확대 이미지">
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC6swyarCj33PWNxkZUfqE9U-Z3200udzo",
          authDomain: "mychelin-14f24.firebaseapp.com",
          projectId: "mychelin-14f24",
          storageBucket: "mychelin-14f24.firebasestorage.app",
          messagingSenderId: "671987526708",
          appId: "1:671987526708:web:134d4749ec92d0f3832e61"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let posts = [];
        let currentView = 'bubble'; 

        function openModal(id) { 
            if (id === 'writeModal' && !document.getElementById('editPostId').value) {
                document.getElementById('modalHeaderTitle').innerText = "맛집 등록하기";
                document.getElementById('submitBtn').innerText = "등록하기";
                document.getElementById('image').required = true; 
            }
            document.getElementById(id).style.display = 'flex'; 
        }
        
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if(id === 'writeModal') {
                document.getElementById('postForm').reset();
                document.getElementById('editPostId').value = ""; 
            }
        }

        function switchView(mode) {
            currentView = mode;
            if(mode === 'bubble') {
                document.getElementById('btnBubble').classList.add('active');
                document.getElementById('btnList').classList.remove('active');
            } else {
                document.getElementById('btnBubble').classList.remove('active');
                document.getElementById('btnList').classList.add('active');
            }
            renderBubbles(); 
        }

        db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            posts = [];
            snapshot.forEach((doc) => { posts.push({ id: doc.id, ...doc.data() }); });
            renderBubbles();
        }, (error) => {
            console.error("데이터 가져오기 실패:", error);
        });

        function renderBubbles() {
            const container = document.getElementById('bubble-container');
            container.innerHTML = '';
            
            if (currentView === 'list') {
                container.removeAttribute('style'); 
                container.className = 'list-view-mode';
                
                posts.forEach((post, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bubble-item';
                    
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble has-img';
                    bubble.style.backgroundImage = `url(${post.image})`;

                    const info = document.createElement('div');
                    info.className = 'bubble-info';
                    info.innerText = post.author; 

                    const titleText = document.createElement('div');
                    titleText.className = 'list-title-text';
                    titleText.innerText = post.title; 

                    itemDiv.appendChild(bubble);
                    itemDiv.appendChild(info);
                    itemDiv.appendChild(titleText);
                    
                    itemDiv.onclick = () => showDetail(index);
                    container.appendChild(itemDiv);
                });
                return;
            }

            container.className = '';
            const containerWidth = container.clientWidth;
            const cellWidth = 100; 
            const cellHeight = 130; 
            const cols = Math.floor(containerWidth / cellWidth) || 3;

            const totalItems = posts.length;
            const rows = Math.ceil(totalItems / cols) + 2;

            container.style.height = `${rows * cellHeight}px`;
            
            let availableCells = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    availableCells.push({ r: r, c: c });
                }
            }

            posts.forEach((post, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bubble-item';

                let hash = 0;
                for (let i = 0; i < post.id.length; i++) hash = post.id.charCodeAt(i) + ((hash << 5) - hash);
                
                let cellIndex = Math.abs(hash) % (availableCells.length || 1);
                let cell = availableCells[cellIndex] || { r: 0, c: 0 };
                
                if (availableCells.length > 0) {
                    availableCells.splice(cellIndex, 1);
                }

                const offsetX = (hash % 12); 
                const offsetY = ((hash >> 2) % 15);

                const posX = cell.c * cellWidth + ((containerWidth - (cols * cellWidth)) / 2) + offsetX;
                const posY = cell.r * cellHeight + 15 + offsetY;
                
                itemDiv.style.left = `${posX}px`;
                itemDiv.style.top = `${posY}px`;
                itemDiv.style.animationDelay = `${(hash % 10) * 0.2}s`;

                const bubble = document.createElement('div');
                bubble.className = 'bubble has-img';
                bubble.style.backgroundImage = `url(${post.image})`;

                const info = document.createElement('div');
                info.className = 'bubble-info';
                info.innerText = post.author;

                itemDiv.appendChild(bubble);
                itemDiv.appendChild(info);
                
                // [핵심 패치] 드래그 이벤트 추가 함수 호출
                makeElementDraggable(itemDiv, index);

                container.appendChild(itemDiv);
            });
        }

        // ★ 버블 드래그 구현 핵심 자바스크립트 함수 ★
        function makeElementDraggable(elmnt, index) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let isMoved = false;      // 단순 클릭인지 진짜 드래그인지 판별하는 변수
            let dragStarted = false;  // 드래그 활성화 여부
            let touchTimer = null;    // 모바일 꾹 누르기 타이머

            // 마우스 우클릭 기본 메뉴창 방지
            elmnt.addEventListener('contextmenu', (e) => {
                if (currentView === 'bubble') e.preventDefault();
            });

            // 1. PC 마우스 이벤트 바인딩
            elmnt.onmousedown = dragMouseDown;

            // 2. 모바일 터치 이벤트 바인딩
            elmnt.addEventListener('touchstart', (e) => {
                if (currentView !== 'bubble') return;
                isMoved = false;
                dragStarted = false;
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;

                // 모바일에서 0.2초 동안 꾹 누르고 있으면 드래그 모드 활성화 (스크롤 방해 최소화)
                touchTimer = setTimeout(() => {
                    dragStarted = true;
                    elmnt.classList.add("dragging");
                }, 200);
            }, { passive: true });

            elmnt.addEventListener('touchmove', (e) => {
                if (!dragStarted) {
                    clearTimeout(touchTimer);
                    return; 
                }
                // 드래그 중에는 모바일 화면 전체가 스크롤되는 것을 막음
                if(e.cancelable) e.preventDefault(); 
                
                isMoved = true;
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX;
                pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }, { passive: false });

            elmnt.addEventListener('touchend', () => {
                clearTimeout(touchTimer);
                elmnt.classList.remove("dragging");
                // 움직임이 전혀 없었다면 상세 모달 오픈
                if (!isMoved) {
                    showDetail(index);
                }
            });

            function dragMouseDown(e) {
                if (currentView !== 'bubble') return;
                // 마우스 좌클릭(0) 또는 우클릭(2)일 때만 작동하도록 제한
                if (e.button !== 0 && e.button !== 2) return;
                
                e.preventDefault();
                isMoved = false;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                elmnt.classList.add("dragging");
                
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                isMoved = true; // 마우스가 움직였으므로 드래그 상태로 전환
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                elmnt.classList.remove("dragging");
                
                // 드래그하지 않고 단순 클릭만 했을 때 상세 보기 모달 오픈
                if (!isMoved) {
                    showDetail(index);
                }
            }
        }

        function savePost(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const editId = document.getElementById('editPostId').value; 

            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const imageFile = document.getElementById('image').files[0];

            submitBtn.innerText = editId ? "게시글 수정 중..." : "사진 압축 및 업로드 중...";
            submitBtn.disabled = true;

            if (editId && !imageFile) {
                db.collection("posts").doc(editId).update({
                    author: author,
                    title: title,
                    content: content
                }).then(() => {
                    closeModal('writeModal');
                }).catch((error) => {
                    alert("수정 실패: " + error.message);
                }).finally(() => {
                    submitBtn.disabled = false;
                });
                return;
            }

            if (!imageFile && !editId) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const max_size = 1200; 

                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }
                    canvas.width = width; canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataURL = canvas.toDataURL('image/jpeg', 0.85);

                    if (editId) {
                        db.collection("posts").doc(editId).update({
                            author: author,
                            title: title,
                            content: content,
                            image: compressedDataURL
                        }).then(() => { closeModal('writeModal'); })
                          .catch((error) => { alert("수정 실패: " + error.message); })
                          .finally(() => { submitBtn.disabled = false; });
                    } else {
                        db.collection("posts").add({
                            author: author,
                            title: title,
                            content: content,
                            image: compressedDataURL,
                            createdAt: new Date()
                        }).then(() => { closeModal('writeModal'); })
                          .catch((error) => { alert("업로드 실패: " + error.message); })
                          .finally(() => { submitBtn.disabled = false; });
                    }
                };
            };
            reader.readAsDataURL(imageFile);
        }

        function showDetail(index) {
            const post = posts[index];
            document.getElementById('detailImg').src = post.image;
            document.getElementById('detailTitle').innerText = post.title;
            document.getElementById('detailAuthor').innerText = `작성자: ${post.author}`;
            document.getElementById('detailContent').innerText = post.content;
            
            document.getElementById('deleteBtn').onclick = () => deletePost(post.id);
            document.getElementById('editBtn').onclick = () => editPost(index); 
            document.getElementById('detailImg').onclick = () => zoomImage(post.image);
            
            openModal('detailModal');
        }

        function editPost(index) {
            const post = posts[index];
            closeModal('detailModal'); 
            
            document.getElementById('editPostId').value = post.id;
            document.getElementById('author').value = post.author;
            document.getElementById('title').value = post.title;
            document.getElementById('content').value = post.content;
            
            document.getElementById('modalHeaderTitle').innerText = "맛집 정보 수정하기";
            document.getElementById('submitBtn').innerText = "수정 완료";
            document.getElementById('image').required = false; 

            openModal('writeModal');
        }

        function deletePost(id) {
            if(confirm("이 맛집 게시글을 정말 삭제하시겠습니까?")) {
                db.collection("posts").doc(id).delete().then(() => { closeModal('detailModal'); });
            }
        }

        window.addEventListener('resize', renderBubbles);

        function zoomImage(imgSrc) {
            document.getElementById('zoomImg').src = imgSrc;
            document.getElementById('zoomModal').style.display = 'flex';
        }

        function closeZoom() {
            document.getElementById('zoomModal').style.display = 'none';
        }
    </script>
</body>
</html>
