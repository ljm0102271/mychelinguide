<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYCHELIN GUIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@800&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Paperlogy-5Medium';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-1@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }

        body {
            margin: 0; padding: 0;
            background-color: #E3F2FD;
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 25px; box-sizing: border-box; height: 75px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            position: sticky; top: 0; z-index: 50;
        }

        h1 { 
            margin: 0; 
            font-family: 'Paperlogy-5Medium', sans-serif; 
            font-weight: 500;                    
            font-size: 1.5rem;                    
            color: #37474F; 
            letter-spacing: -0.5px;    
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .write-btn {
            background-color: #3F51B5; color: white; border: none; padding: 10px 18px;
            border-radius: 20px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s;
        }
        .write-btn:hover { background-color: #303F9F; transform: translateY(-1px); }
        
        /* 버블 컨테이너 영역 */
        #bubble-container { 
            position: relative; 
            width: 100%; 
            max-width: 100vw;
            box-sizing: border-box;
            padding: 20px;
            min-height: calc(100vh - 75px);
        }

        .bubble-item {
            position: absolute; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none; 
            -webkit-user-drag: none;
            touch-action: manipulation;
        }
        .bubble-item:hover { transform: scale(1.12); z-index: 10; }

        .bubble {
            width: 85px; height: 85px; border-radius: 50%; 
            background-size: cover; background-position: center;
            background-color: rgba(255, 255, 255, 0.7); 
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12); 
            overflow: hidden;
            position: relative;
        }
        
        .bubble-info {
            margin-top: 6px; 
            font-size: 0.75rem; 
            color: #37474F; 
            background: rgba(255, 255, 255, 0.85);
            padding: 2px 8px; 
            border-radius: 12px; 
            text-align: center; 
            max-width: 95px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
            backdrop-filter: blur(4px);
        }
        .modal-content { background-color: white; padding: 24px; border-radius: 20px; width: 100%; max-width: 400px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .modal h2 { margin-top: 0; font-size: 1.3rem; color: #37474F; font-family: 'Paperlogy-5Medium', sans-serif; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; color: #546E7A; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 11px; border: 1px solid #CFD8DC; border-radius: 10px; box-sizing: border-box; font-size: 0.95rem; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #3F51B5; }
        .form-group textarea { height: 100px; resize: none; }
        .btn-area { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .btn-submit { background-color: #3F51B5; color: white; }
        .btn-close { background-color: #ECEFF1; color: #546E7A; }
        .btn-delete { background-color: #FF5252; color: white; margin-right: auto; }
        .btn-edit { background-color: #FFB300; color: white; } 
        
        .detail-img { width: 100%; max-height: 280px; object-fit: contain; background-color: #f8fafc; border-radius: 12px; margin-bottom: 12px; cursor: zoom-in; }
        .detail-title { font-size: 1.25rem; font-weight: bold; color: #37474F; margin-bottom: 6px; }
        .detail-author { font-size: 0.85rem; color: #78909C; margin-bottom: 12px; border-bottom: 1px solid #ECEFF1; padding-bottom: 8px; font-weight: 500; }
        .detail-content { font-size: 0.95rem; color: #37474F; white-space: pre-wrap; line-height: 1.5; }
        
        .zoom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center;
            cursor: zoom-out;
        }
        .zoom-img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }

        .view-toggle-area { display: none; }

        @media (max-width: 600px) {
            header { padding: 10px 15px; height: 65px; }
            h1 { font-size: 1.2rem; }
            .write-btn { padding: 7px 14px; font-size: 0.8rem; }
            .bubble { width: 75px; height: 75px; }
            .bubble-info { max-width: 82px; font-size: 0.7rem; }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <h1>
            MYCHELIN🍽️
            <div class="view-toggle-area">
                <button id="btnBubble" class="toggle-btn active" onclick="switchView('bubble')">버블</button>
                <button id="btnList" class="toggle-btn" onclick="switchView('list')">리스트</button>
            </div>
        </h1>
        <button class="write-btn" onclick="openModal('writeModal')">맛집 등록하기</button>
    </header>

    <div id="bubble-container"></div>

    <div id="writeModal" class="modal">
        <div class="modal-content">
            <h2 id="modalHeaderTitle">맛집 등록하기</h2>
            <form id="postForm" onsubmit="savePost(event)">
                <input type="hidden" id="editPostId" value="">
                <div class="form-group">
                    <label>학번 이름</label>
                    <input type="text" id="author" placeholder="예: 10101 홍길동" required>
                </div>
                <div class="form-group">
                    <label>맛집 이름 (제목)</label>
                    <input type="text" id="title" placeholder="어디에 있는 어떤 맛집인가요?" required>
                </div>
                <div class="form-group">
                    <label>추천 이유 (내용)</label>
                    <textarea id="content" placeholder="맛있는 메뉴나 꿀팁을 적어주세요!" required></textarea>
                </div>
                <div class="form-group" id="imageInputGroup">
                    <label>맛집 사진</label>
                    <input type="file" id="image" accept="image/*">
                </div>
                <div class="btn-area">
                    <button type="button" class="btn btn-close" onclick="closeModal('writeModal')">취소</button>
                    <button type="submit" class="btn btn-submit" id="submitBtn">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <img id="detailImg" class="detail-img" src="" alt="맛집 사진">
            <div id="detailTitle" class="detail-title"></div>
            <div id="detailAuthor" class="detail-author"></div>
            <div id="detailContent" class="detail-content"></div>
            <div class="btn-area">
                <button type="button" id="deleteBtn" class="btn btn-delete">삭제</button>
                <button type="button" id="editBtn" class="btn btn-edit">수정</button> 
                <button type="button" class="btn btn-close" onclick="closeModal('detailModal')">닫기</button>
            </div> 
        </div>
    </div>

    <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
        <img id="zoomImg" class="zoom-img" src="" alt="확대 이미지">
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC6swyarCj33PWNxkZUfqE9U-Z3200udzo",
          authDomain: "mychelin-14f24.firebaseapp.com",
          projectId: "mychelin-14f24",
          storageBucket: "mychelin-14f24.firebasestorage.app",
          messagingSenderId: "671987526708",
          appId: "1:671987526708:web:134d4749ec92d0f3832e61"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let posts = [];
        let currentView = 'bubble'; 

        window.addEventListener('resize', () => {
            if (currentView === 'bubble') renderBubbles();
        });

        function openModal(id) { 
            if (id === 'writeModal' && !document.getElementById('editPostId').value) {
                document.getElementById('modalHeaderTitle').innerText = "맛집 등록하기";
                document.getElementById('submitBtn').innerText = "등록하기";
                document.getElementById('image').required = true; 
            }
            document.getElementById(id).style.display = 'flex'; 
        }
        
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if(id === 'writeModal') {
                document.getElementById('postForm').reset();
                document.getElementById('editPostId').value = ""; 
            }
        }

        function switchView(mode) {
            currentView = mode;
            renderBubbles(); 
        }

        db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            posts = [];
            snapshot.forEach((doc) => { posts.push({ id: doc.id, ...doc.data() }); });
            renderBubbles();
        }, (error) => {
            console.error("데이터 가져오기 실패:", error);
        });

        // 겹치지 않고 적당한 간격으로 정돈된 버블 배치 로직
        function renderBubbles() {
            const container = document.getElementById('bubble-container');
            container.innerHTML = '';
            
            const containerWidth = container.clientWidth || window.innerWidth;
            const isMobile = window.innerWidth < 600;

            // 버블 하나의 차지하는 가로/세로 간격 여유 있게 설정
            const cellWidth = isMobile ? 105 : 125;
            const cellHeight = isMobile ? 120 : 140;
            
            const cols = Math.floor((containerWidth - 20) / cellWidth) || 1;
            
            posts.forEach((post, index) => {
                let hash = 0;
                for (let i = 0; i < post.id.length; i++) hash = post.id.charCodeAt(i) + ((hash << 5) - hash);
                
                const col = index % cols;
                const row = Math.floor(index / cols);

                // 칸 안에서 자연스럽게 보이도록 미세한 랜덤 오프셋 부여 (과도한 겹침 차단)
                const offsetX = (Math.abs(hash * 13) % 30) - 15;
                const offsetY = (Math.abs(hash * 17) % 30) - 15;

                // 좌우 여백을 주어 중앙 정렬 느낌 유도
                const totalGridWidth = cols * cellWidth;
                const startX = (containerWidth - totalGridWidth) / 2;

                let posX = startX + (col * cellWidth) + offsetX + 10;
                let posY = 20 + (row * cellHeight) + offsetY;

                // 화면 밖으로 나가지 않도록 안전장치
                if (posX < 10) posX = 10;
                if (posX > containerWidth - 100) posX = containerWidth - 100;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'bubble-item';
                itemDiv.style.left = posX + "px";
                itemDiv.style.top = posY + "px";
                
                const bubble = document.createElement('div');
                bubble.className = 'bubble has-img';
                bubble.style.backgroundImage = `url(${post.image})`;

                const info = document.createElement('div');
                info.className = 'bubble-info';
                info.innerText = post.author;

                itemDiv.appendChild(bubble);
                itemDiv.appendChild(info);
                
                itemDiv.onclick = () => showDetail(index);
                container.appendChild(itemDiv);
            });

            // 전체 세로 스크롤 높이 동적 확보
            const totalRows = Math.ceil(posts.length / cols);
            container.style.height = (totalRows * cellHeight + 100) + "px";
        }

        function savePost(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const editId = document.getElementById('editPostId').value; 

            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const imageFile = document.getElementById('image').files[0];

            submitBtn.innerText = editId ? "게시글 수정 중..." : "사진 압축 및 업로드 중...";
            submitBtn.disabled = true;

            if (editId && !imageFile) {
                db.collection("posts").doc(editId).update({
                    author: author,
                    title: title,
                    content: content
                }).then(() => { closeModal('writeModal'); })
                  .catch((error) => { alert("수정 실패: " + error.message); })
                  .finally(() => { submitBtn.disabled = false; });
                return;
            }

            if (!imageFile && !editId) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max_size = 1200; 

                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }
                    canvas.width = width; canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataURL = canvas.toDataURL('image/jpeg', 0.85);

                    if (editId) {
                        db.collection("posts").doc(editId).update({
                            author: author,
                            title: title,
                            content: content,
                            image: compressedDataURL
                        }).then(() => { closeModal('writeModal'); })
                          .catch((error) => { alert("수정 실패: " + error.message); })
                          .finally(() => { submitBtn.disabled = false; });
                    } else {
                        db.collection("posts").add({
                            author: author,
                            title: title,
                            content: content,
                            image: compressedDataURL,
                            createdAt: new Date()
                        }).then(() => { closeModal('writeModal'); })
                          .catch((error) => { alert("업로드 실패: " + error.message); })
                          .finally(() => { submitBtn.disabled = false; });
                    }
                };
            };
            reader.readAsDataURL(imageFile);
        }

        function showDetail(index) {
            const post = posts[index];
            document.getElementById('detailImg').src = post.image;
            document.getElementById('detailTitle').innerText = post.title;
            document.getElementById('detailAuthor').innerText = `작성자: ${post.author}`;
            document.getElementById('detailContent').innerText = post.content;
            
            document.getElementById('deleteBtn').onclick = () => deletePost(post.id);
            document.getElementById('editBtn').onclick = () => editPost(index); 
            document.getElementById('detailImg').onclick = () => zoomImage(post.image);
            
            openModal('detailModal');
        }

        function editPost(index) {
            const post = posts[index];
            closeModal('detailModal'); 
            
            document.getElementById('editPostId').value = post.id;
            document.getElementById('author').value = post.author;
            document.getElementById('title').value = post.title;
            document.getElementById('content').value = post.content;
            
            document.getElementById('modalHeaderTitle').innerText = "맛집 정보 수정하기";
            document.getElementById('submitBtn').innerText = "수정 완료";
            document.getElementById('image').required = false; 

            openModal('writeModal');
        }

        function deletePost(id) {
            if(confirm("이 맛집 게시글을 정말 삭제하시겠습니까?")) {
                db.collection("posts").doc(id).delete().then(() => { closeModal('detailModal'); });
            }
        }

        function zoomImage(imgSrc) {
            document.getElementById('zoomImg').src = imgSrc;
            document.getElementById('zoomModal').style.display = 'flex';
        }

        function closeZoom() {
            document.getElementById('zoomModal').style.display = 'none';
        }
    </script>
</body>
</html>
